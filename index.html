<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>IEC 63339 Knowledge Architecture Workbench</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.8/dist/mermaid.min.js"></script>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>

  <div class="control-deck">
    <!-- ЯРУС 1: Архитектурные уровни IEC 63339 (SMIM & SMS) -->
    <div class="deck-row deck-row-top">
      <div class="section-label">
        <span class="iec-badge">IEC 63339 / SMIM<span class="iec-tooltip" id="tt-smim"></span></span>
        <span id="lbl-onto-title">Ontologi:</span>
      </div>
      <div class="btn-group">
        <button id="onto-bfo" class="active" onclick="setOntology('BFO')">BFO (3D Continuant)</button>
        <button id="onto-iso" onclick="setOntology('ISO15926')">ISO 15926 (4D Perdurant)</button>
      </div>

      <div class="divider"></div>

      <div class="section-label">
        <span class="iec-badge">IEC 63339 / SMS<span class="iec-tooltip" id="tt-sms"></span></span>
        <span id="lbl-graph-title">Datamodell:</span>
      </div>
      <div class="btn-group">
        <button id="mode-lpg" class="active" onclick="setGraphMode('LPG')">LPG</button>
        <button id="mode-rdf" onclick="setGraphMode('RDF')">RDF (W3C)</button>
      </div>

      <div class="divider"></div>

      <div class="section-label">🎨 <span id="lbl-engine-title">Motor:</span></div>
      <div class="btn-group">
        <button id="eng-vis" class="active" onclick="setEngine('vis')">🌐 Vis.js</button>
        <button id="eng-mermaid" onclick="setEngine('mermaid')">📊 Mermaid</button>
      </div>

      <div style="margin-left: auto;" class="btn-group flag-group">
        <button id="lang-sv" class="active" onclick="setLanguage('sv')" title="Svenska">🇸🇪</button>
        <button id="lang-en" onclick="setLanguage('en')" title="British English">🇬🇧</button>
        <button id="lang-ru" onclick="setLanguage('ru')" title="Русский">🇷🇺</button>
      </div>
    </div>

    <!-- ЯРУС 2: SMRM Concept Repository & Ввод действий -->
    <div class="deck-row">
      <span class="badge" id="time-display">T = 0</span>
      <button id="step-btn" onclick="advanceTime()"></button>

      <div class="divider"></div>

      <span class="iec-badge" style="background: #f1f5f9; color: #475569; border-color: #cbd5e1;">
        IEC 63339 / SMRM: <span id="lbl-smrm-status" style="font-weight: normal; margin-left: 3px;">Domain Ontology (Fixed: System/IDO)</span>
        <span class="iec-tooltip" id="tt-smrm"></span>
      </span>

      <div class="divider"></div>

      <label id="lbl-parent" style="font-size: 11px; color: #64748b; font-weight: 600;"></label>
      <select id="parent-select"></select>
      
      <input type="text" id="part-input" style="width: 120px;">
      <button id="add-btn" class="secondary" onclick="handleAddPart()"></button>
      
      <div class="divider"></div>
      <select id="remove-select"></select>
      <button id="remove-btn" class="danger" onclick="handleRemoveEdge()"></button>

      <div class="divider"></div>

      <label style="font-size: 11px; color: #475569; display: flex; align-items: center; gap: 4px;">
        <input type="checkbox" id="history-toggle" checked onchange="render()"> <span id="lbl-history"></span>
      </label>

      <!-- Сохранение/Загрузка -->
      <div class="divider"></div>
      <button id="save-btn" class="secondary" onclick="exportData()"></button>
      <button id="load-btn" class="secondary" onclick="document.getElementById('file-input').click()"></button>
      <input type="file" id="file-input" style="display: none;" accept=".json" onchange="importData(event)">
    </div>
  </div>

  <div class="main-container">
    <div id="canvas-container">
      <div id="vis-container"></div>
      <div id="mermaid-container" style="display: none;"></div>
      <div id="graph-legend" class="graph-legend"></div>
    </div>
    
    <!-- Ползунок для горизонтального изменения размеров панелей -->
    <div class="resizer" id="panel-resizer"></div>
    
    <div class="sidebar">
      <!-- URMSM: Viewpoint & Concerns -->
      <div class="card" id="card-bom" style="flex: 0 0 25%;">
        <h4>
          <span id="title-bom"></span>
          <!-- Добавлен класс align-right для выравнивания тултипа влево от края экрана -->
          <span class="iec-badge align-right">IEC 63339 / URMSM<span class="iec-tooltip" id="tt-urmsm"></span></span>
        </h4>
        <div id="tree-container" style="overflow-y: auto;"></div>
      </div>

      <div class="resizer-h" id="resizer-bom-storage"></div>

      <!-- SMS: Low-Level Storage Details -->
      <div class="card" id="card-storage" style="flex: 0 0 40%;">
        <h4>
          <span id="title-storage"></span>
          <span id="storage-paradigm-tag" style="color:#0284c7; font-weight: 600;"></span>
        </h4>
        <div id="storage-content" style="overflow-y: auto; display: flex; flex-direction: column;"></div>
      </div>

      <div class="resizer-h" id="resizer-storage-query"></div>

      <!-- DB Query Panel -->
      <div class="card" id="card-query" style="flex: 1;">
        <h4>
          <span id="title-query"></span>
          <span id="query-desc" style="font-weight: normal; text-transform: none; color: #0d9488;"></span>
        </h4>
        <div id="query-content" style="display: flex; flex-direction: column; flex: 1;"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
